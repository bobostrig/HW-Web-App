<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1722">
  <meta name="description" content="A tower crane placement game.">
  <title>High Steel | Tower Crane Challenge</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #edf4f6;
      background: #08131d;
      font-synthesis: none;
      --muted: #9babb5;
      --line: rgb(205 226 233 / 13%);
      --cyan: #77d9df;
      --amber: #ffbd62;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: clamp(12px, 2.5vw, 34px);
      background:
        radial-gradient(ellipse at 50% -20%, rgb(68 103 117 / 22%), transparent 55%),
        #08131d;
    }

    .app-shell { width: min(100%, 1500px); margin: 0 auto; }

    .topline {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin: 0 2px 18px;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: var(--cyan);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    h1 { margin: 0; font-size: clamp(22px, 3vw, 34px); line-height: 1; letter-spacing: -.045em; }
    .topline-note { margin: 0; color: var(--muted); font-size: 12px; text-align: right; }

    .hud {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 5px;
      position: absolute;
      z-index: 2;
      bottom: 10px;
      left: 50%;
      width: max-content;
      max-width: calc(100% - 16px);
      transform: translateX(-50%);
      pointer-events: none;
    }

    .hud-card {
      min-width: 52px;
      min-height: 34px;
      padding: 5px 8px 4px;
      border: 1px solid rgb(205 226 233 / 20%);
      border-radius: 6px;
      background: linear-gradient(145deg, rgb(18 33 44 / 94%), rgb(10 23 33 / 92%));
      box-shadow: 0 3px 10px rgb(0 0 0 / 18%);
    }

    .hud-label { display: block; overflow: hidden; color: var(--muted); font-size: 7px; font-weight: 800; letter-spacing: .08em; text-overflow: ellipsis; text-transform: uppercase; white-space: nowrap; }
    .hud-value { display: block; margin-top: 2px; color: #f5fafb; font-size: 12px; font-weight: 750; letter-spacing: -.03em; line-height: 1; white-space: nowrap; }
    .hud-value small { color: #aabac3; font-size: 8px; font-weight: 600; letter-spacing: 0; }
    .hud-card.timer .hud-value { color: var(--amber); }
    .hud-card.capacity .hud-value { color: var(--cyan); }

    .game-frame {
      position: relative;
      overflow: hidden;
      border: 1px solid rgb(190 216 225 / 18%);
      border-radius: 14px;
      background: #172b38;
      box-shadow: 0 24px 70px rgb(0 0 0 / 32%);
    }

    .scene { display: block; width: 100%; height: auto; aspect-ratio: 1440 / 660; }
    .scene text { font-family: Inter, ui-sans-serif, system-ui, sans-serif; }

    .footer-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 13px 3px 0;
      color: var(--muted);
      font-size: 11px;
    }

    .beam-legend { display: flex; flex-wrap: wrap; gap: 8px; }
    .beam-chip { padding: 6px 9px; border: 1px solid var(--line); border-radius: 999px; background: #101e29; color: #dce8eb; }
    .beam-chip strong { color: #fff; }
    .status { display: flex; align-items: center; gap: 7px; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #79d7ac; box-shadow: 0 0 12px rgb(121 215 172 / 55%); }

    @media (max-width: 950px) {
      .scene { min-height: 300px; object-fit: cover; }
    }

    @media (max-width: 560px) {
      body { padding: 12px; }
      .topline { align-items: start; flex-direction: column; gap: 8px; }
      .topline-note { text-align: left; }
      .hud { bottom: 7px; gap: 4px; }
      .hud-card { min-width: 46px; min-height: 31px; padding: 4px 6px; }
      .hud-label { font-size: 6px; }
      .hud-value { font-size: 11px; }
      .scene { min-height: 270px; }
      .footer-bar { align-items: start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="topline">
      <div>
        <p class="eyebrow">High steel · crane challenge</p>
        <h1>Build above the skyline</h1>
      </div>
      <p class="topline-note">Three placements per level · Keep every lift within capacity</p>
    </header>

    <section class="game-frame" aria-label="Tower crane construction site">
      <section class="hud" aria-label="Game status">
        <div class="hud-card timer"><span class="hud-label">Time left</span><span class="hud-value">03:00</span></div>
        <div class="hud-card"><span class="hud-label">Score</span><span class="hud-value">0</span></div>
        <div class="hud-card"><span class="hud-label">High score</span><span class="hud-value">0</span></div>
        <div class="hud-card"><span class="hud-label">Level</span><span class="hud-value">1 <small>/ 5</small></span></div>
        <div class="hud-card"><span class="hud-label">Radius</span><span class="hud-value">42 <small>ft</small></span></div>
        <div class="hud-card capacity"><span class="hud-label">Capacity</span><span class="hud-value">0<small>%</small></span></div>
        <div class="hud-card beams"><span class="hud-label">Steel pieces</span><span class="hud-value">3 <small>to place</small></span></div>
      </section>
      <svg class="scene" viewBox="0 0 1440 660" role="img" aria-labelledby="scene-title scene-desc" xmlns="http://www.w3.org/2000/svg">
        <title id="scene-title">Tower crane construction site</title>
        <desc id="scene-desc">A player crane and an automatic crane work on a three-level steel tower above a city skyline. Three steel beams await placement.</desc>
        <defs>
          <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#7393a0"/><stop offset=".58" stop-color="#c1b9a7"/><stop offset="1" stop-color="#e0c69e"/></linearGradient>
          <linearGradient id="steel" x2="1" y2="1"><stop stop-color="#8799a0"/><stop offset=".48" stop-color="#435864"/><stop offset="1" stop-color="#243844"/></linearGradient>
          <linearGradient id="boom" x2="0" y2="1"><stop stop-color="#f3c676"/><stop offset="1" stop-color="#b47a36"/></linearGradient>
          <linearGradient id="ground" x2="0" y2="1"><stop stop-color="#59615e"/><stop offset="1" stop-color="#272f31"/></linearGradient>
          <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
          <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur stdDeviation="8"/></filter>
        </defs>

        <!-- Sky and distant city -->
        <rect width="1440" height="660" fill="url(#sky)"/>
        <rect width="1440" height="500" fill="url(#grid)"/>
        <circle cx="1180" cy="116" r="45" fill="#f8dfa8" opacity=".44"/>
        <g fill="#526b77" opacity=".55">
          <path d="M0 409h68V263h53v146h25V305h85v104h37V220h61v189h36V286h83v123h31V247h72v162h52V310h68v99h36V194h68v215h42V270h95v139h36V234h65v175h40V303h90v106h42V251h78v158h31V282h77v127h44v106H0z"/>
        </g>
        <g fill="#b3b7aa" opacity=".55">
          <path d="M40 440h43V302h16v138h112V351h18v89h82V268h17v172h151V321h15v119h114V288h18v152h137V252h18v188h97V334h17v106h133V294h19v146h115V313h17v127h98V278h18v162h111v65H0z"/>
        </g>
        <g stroke="#d7c9aa" stroke-width="2" opacity=".28">
          <path d="M282 285v139M291 285v139M421 326v98M430 326v98M710 258v166M721 258v166M1038 300v124M1048 300v124M1267 285v139"/>
        </g>
        <rect y="455" width="1440" height="205" fill="#34454b" opacity=".35"/>

        <!-- Site background equipment -->
        <g opacity=".52" stroke="#34434a" fill="none" stroke-width="5">
          <path d="M110 510v-72m-18 72h36m-30-58h24l-12-18zM1280 510v-86m-19 86h38m-31-67h24l-12-19z"/>
          <path d="M130 457h72m1073 5h84" stroke-width="3"/>
        </g>

        <!-- Base shadows and ground -->
        <ellipse cx="717" cy="585" rx="484" ry="27" fill="#101b20" opacity=".38" filter="url(#soft-shadow)"/>
        <rect y="510" width="1440" height="150" fill="url(#ground)"/>
        <path d="M0 511h1440" stroke="#d6c29c" stroke-opacity=".65" stroke-width="3"/>
        <path d="M0 546h1440M0 624h1440" stroke="#b8a980" stroke-opacity=".13" stroke-width="2"/>
        <g stroke="#c5b58e" stroke-opacity=".16" stroke-width="2">
          <path d="m70 660 80-148m125 148 52-148m235 148 18-148m433 148-28-148m233 148-58-148m150 148-29-148"/>
        </g>

        <!-- Tower foundation -->
        <g transform="translate(0 510) scale(1 1.5) translate(0 -510)">
          <path d="M587 510h266l-21 24H609z" fill="#26343a"/>
          <path d="M612 510h18v-30h-18zm195 0h18v-30h-18z" fill="#59676b"/>
          <path d="M605 480h224v13H605z" fill="#829095"/>
        </g>

        <!-- Unfinished tower: legs, cross braces, three highlighted bays -->
        <g transform="translate(0 510) scale(1 1.5) translate(0 -510)" stroke="url(#steel)" stroke-linecap="square">
          <path d="M625 480V261M815 480V261" fill="none" stroke-width="17"/>
          <path d="M617 458h206M617 376h206M617 294h206M617 261h206" fill="none" stroke="#9aa6a6" stroke-width="12"/>
          <path d="m625 458 190-82m0 82-190-82M625 376l190-82m0 82-190-82M625 294l190-33m0 0-190-33" fill="none" stroke="#586e78" stroke-width="7"/>
          <path d="M625 458 815 376M815 458 625 376M625 376 815 294M815 376 625 294" fill="none" stroke="#c8b17f" stroke-opacity=".76" stroke-width="3"/>
        </g>
        <g transform="translate(0 510) scale(1 1.5) translate(0 -510)" fill="none" stroke="#77d9df" stroke-width="3" stroke-dasharray="7 6" opacity=".9">
          <rect x="648" y="397" width="144" height="27" rx="3"/>
          <rect x="648" y="315" width="144" height="27" rx="3"/>
          <rect x="648" y="267" width="144" height="15" rx="3"/>
        </g>
        <g transform="translate(0 510) scale(1 1.5) translate(0 -510)" fill="#d5f7f4" font-size="10" font-weight="800" letter-spacing="1.5" text-anchor="middle">
          <text x="720" y="416">TARGET 01</text><text x="720" y="334">TARGET 02</text><text x="720" y="279">TARGET 03</text>
        </g>
        <path d="M625 261V230m190 31v-31" transform="translate(0 510) scale(1 1.5) translate(0 -510)" stroke="#819196" stroke-width="8"/>

        <!-- Player crane on the left -->
        <g transform="translate(0 510) scale(1 1.3) translate(0 -510)">
          <path d="M286 510V168M334 510V168" fill="none" stroke="#354951" stroke-width="9"/>
          <path d="M286 470h48m-48-48h48m-48-48h48m-48-48h48m-48-48h48m-48-48h48" fill="none" stroke="#8a9998" stroke-width="5"/>
          <path d="m286 470 48-48m-48 0 48 48m-48-96 48-48m-48 0 48 48m-48-96 48-48m-48 0 48 48" fill="none" stroke="#526870" stroke-width="3"/>
          <path d="M221 156H817M221 175H810m0-19-20 19m-42-19-20 19m-42-19-20 19m-42-19-20 19m-42-19-20 19m-42-19-20 19m-42-19-20 19m-42-19-20 19m-42-19-20 19m-42-19-20 19" fill="none" stroke="url(#boom)" stroke-width="5"/>
          <path d="M335 160h452" stroke="#785d37" stroke-opacity=".75" stroke-width="2"/>
          <path d="M190 130h39v45h-39z" fill="#66594a" stroke="#3c4140" stroke-width="4"/>
          <path d="M195 138h29v6h-29m0 10h29v6h-29m0 10h29v6h-29" stroke="#b49a6a" stroke-width="2"/>
          <path d="M507 147h42v28h-42z" fill="#efbd66" stroke="#725834" stroke-width="4"/>
          <path d="M511 153h34v5h-34z" fill="#ffe1a0" opacity=".7"/>
          <circle cx="515" cy="177" r="5" fill="#705c3b"/><circle cx="541" cy="177" r="5" fill="#705c3b"/>
          <path d="M528 175v158" stroke="#273943" stroke-width="3"/>
          <path d="M519 332h18l-2 18h-14z" fill="#a8b2ae" stroke="#394951" stroke-width="3"/>
          <path d="M515 352h25l-4 12h-18z" fill="#56686e"/>
          <circle cx="528" cy="168" r="5" fill="#ffdf91"/>
        </g>

        <!-- Load pickup pieces -->
        <g>
          <path d="M179 499v-18m-12 18h24" stroke="#293b43" stroke-width="3"/>
          <rect x="147" y="465" width="65" height="13" rx="2" fill="#9ba8a7" stroke="#33464e" stroke-width="3"/>
          <path d="M158 465v13m43-13v13" stroke="#4c616a" stroke-width="3"/>
          <rect x="137" y="440" width="84" height="23" rx="11" fill="#14252e" stroke="#61747a"/>
          <text x="179" y="456" fill="#e9f0eb" text-anchor="middle" font-size="12.5" font-weight="700">8,000 lb</text>

          <path d="M437 499v-18m-12 18h24" stroke="#293b43" stroke-width="3"/>
          <rect x="405" y="465" width="65" height="13" rx="2" fill="#879797" stroke="#33464e" stroke-width="3"/>
          <path d="M416 465v13m43-13v13" stroke="#4c616a" stroke-width="3"/>
          <rect x="395" y="440" width="84" height="23" rx="11" fill="#14252e" stroke="#61747a"/>
          <text x="437" y="456" fill="#e9f0eb" text-anchor="middle" font-size="12.5" font-weight="700">6,500 lb</text>

          <path d="M518 499v-18m-12 18h24" stroke="#293b43" stroke-width="3"/>
          <rect x="486" y="465" width="65" height="13" rx="2" fill="#aab5b0" stroke="#33464e" stroke-width="3"/>
          <path d="M497 465v13m43-13v13" stroke="#4c616a" stroke-width="3"/>
          <rect x="476" y="440" width="84" height="23" rx="11" fill="#14252e" stroke="#61747a"/>
          <text x="518" y="456" fill="#e9f0eb" text-anchor="middle" font-size="12.5" font-weight="700">5,000 lb</text>
        </g>

        <!-- Worker on a tower beam -->
        <g transform="translate(0 510) scale(1 1.5) translate(0 -510) translate(746 335) scale(1 .9)" stroke-linecap="round" stroke-linejoin="round">
          <path d="M-6 27v18m8-18 9 17" stroke="#35444a" stroke-width="5"/>
          <path d="M-8 9h15l5 20H-12z" fill="#c7463b" stroke="#792f2b" stroke-width="2"/>
          <path d="M-4 8-12 19m19-10 9 8" fill="none" stroke="#c7463b" stroke-width="5"/>
          <circle cx="0" cy="0" r="7" fill="#bd8565" stroke="#644c43" stroke-width="2"/>
          <path d="M-8-4h16l-3-5h-10z" fill="#f2bd54" stroke="#805b2b" stroke-width="2"/>
          <path d="M15 14 21 7l3 2-6 8" stroke="#8d6940" stroke-width="3"/>
        </g>

        <!-- Automatic crane on the right -->
        <g transform="translate(0 510) scale(1 1.45) translate(0 -510)">
          <path d="M1082 510V218M1128 510V218" fill="none" stroke="#394743" stroke-width="9"/>
          <path d="M1082 463h46m-46-48h46m-46-48h46m-46-48h46m-46-48h46m-46-48h46" fill="none" stroke="#829087" stroke-width="5"/>
          <path d="m1082 463 46-48m-46 0 46 48m-46-96 46-48m-46 0 46 48m-46-96 46-48m-46 0 46 48" fill="none" stroke="#53635e" stroke-width="3"/>
          <path d="M1105 204H750m0 18h355m-330-18-20 18m82-18-20 18m82-18-20 18m82-18-20 18m82-18-20 18m82-18-20 18m82-18-20 18" fill="none" stroke="url(#boom)" stroke-width="5"/>
          <path d="M1105 204h235m0 18h-235m210-18-20 18m-54-18 20 18m-54-18 20 18m-54-18 20 18" fill="none" stroke="url(#boom)" stroke-width="5"/>
          <path d="M780 208h300" stroke="#785d37" stroke-opacity=".75" stroke-width="2"/>
          <path d="M1321 180h28v42h-28z" fill="#66594a" stroke="#3c4140" stroke-width="4"/>
          <path d="M1325 188h20v5h-20m0 8h20v5h-20m0 8h20v5h-20" stroke="#b49a6a" stroke-width="2"/>
          <path d="M902 197h40v25h-40z" fill="#d4a956" stroke="#5a4b31" stroke-width="4"/>
          <circle cx="910" cy="224" r="5" fill="#51452f"/><circle cx="934" cy="224" r="5" fill="#51452f"/>
          <path d="M922 222v110" stroke="#273943" stroke-width="3"/>
          <path d="M913 329h18l-2 18h-14z" fill="#a8b2ae" stroke="#394951" stroke-width="3"/>
          <path d="M909 347h25l-4 12h-18z" fill="#56686e"/>
          <circle cx="922" cy="199" r="5" fill="#ffdf91"/>
        </g>

        <!-- Black birds -->
        <g fill="none" stroke="#18242a" stroke-width="4" stroke-linecap="round">
          <path d="m902 116 10-9 10 9 10-9 10 9"/><path d="m977 157 8-7 8 7 8-7 8 7"/><path d="m853 176 7-6 7 6 7-6 7 6"/>
        </g>

        <path d="M0 510h1440" stroke="#f2dbab" stroke-opacity=".16" stroke-width="1"/>
      </svg>
    </section>

    <footer class="footer-bar">
      <div class="beam-legend" aria-label="Beam weights">
        <span class="beam-chip">Beam 1 <strong>8,000 lb</strong></span>
        <span class="beam-chip">Beam 2 <strong>6,500 lb</strong></span>
        <span class="beam-chip">Beam 3 <strong>5,000 lb</strong></span>
      </div>
      <div class="status"><span class="status-dot" aria-hidden="true"></span>Scene preview · crane controls coming next</div>
    </footer>
  </main>
</body>
</html>
