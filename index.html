<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A single-file web app published with GitHub Pages.">
  <title>Web App</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1f2937;
      background: #f8fafc;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 1.5rem;
    }

    main {
      width: min(100%, 42rem);
      padding: clamp(1.5rem, 5vw, 3rem);
      border: 1px solid #e2e8f0;
      border-radius: 1rem;
      background: #fff;
      box-shadow: 0 1rem 2.5rem rgb(15 23 42 / 8%);
    }

    h1 { margin: 0 0 0.75rem; font-size: clamp(1.75rem, 5vw, 2.5rem); }
    p { margin: 0; color: #475569; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <h1>Web App</h1>
    <p>This app is ready for its purpose and features to be defined.</p>
  </main>
</body>
</html>
